name: Kazira dependency maintenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kazira-dependency-maintenance
  cancel-in-progress: false

jobs:
  lockfile-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply non-breaking dependency security fixes
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Generate audit report
        run: npm audit --json > npm-audit.json || true
      - name: Summarize audit report
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('Dependency audit:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(name + ' | severity=' + item.severity + ' | direct=' + item.isDirect + ' | fixAvailable=' + JSON.stringify(item.fixAvailable));
          }
          NODE
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: kazira-npm-audit
          path: npm-audit.json
          retention-days: 14
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize Kazira npm lockfile"
          git push origin HEAD:main
